<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b1a19">
<title>Make a Door</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; min-height: 100dvh;
    background: radial-gradient(ellipse at 50% 30%, #2e2c2a, #161514 70%) fixed;
    color: #e9e6e1; font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  main {
    width: min(100%, 492px); margin: 0 auto;
    padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 16px;
  }

  /* The photo, as on the door: a full-width strip; tap to grow it to the whole picture. */
  .note {
    --w: min(100vw - 32px, 460px);
    --full-h: min(var(--w) * 1448 / 1086, 72dvh);
    flex: none; align-self: center; width: var(--w); height: calc(var(--w) / 2);
    border: 0; border-radius: 14px; cursor: zoom-in;
    background: #8d9094 url(door-blank.jpg) no-repeat;
    background-size: 100% auto; background-position: 50% 48.5%;
    box-shadow: 0 8px 24px rgba(0, 0, 0, .45), inset 0 0 0 1px rgba(255, 255, 255, .08);
    transition: width .35s ease, height .35s ease, background-position .35s ease;
  }
  .note.open {
    width: calc(var(--full-h) * 1086 / 1448); height: var(--full-h);
    background-position: 50% 50%; cursor: zoom-out;
  }

  .field { display: flex; flex-direction: column; gap: 6px; }
  .field > label { font-size: 14px; font-weight: 600; color: #b9b5ae; }
  small { font-size: 13px; color: #8f8b85; transition: color .2s; }
  small.warn { color: #f0a35e; }
  textarea, input {
    width: 100%; font: inherit; color: #1b1a19; background: #f4f1ea;
    border: 1px solid #5a5650; border-radius: 10px; padding: 10px 12px;
  }
  textarea { min-height: 120px; resize: vertical; }
  #code { font-size: 22px; letter-spacing: .2em; font-variant-numeric: tabular-nums; text-transform: uppercase; }
  textarea:focus, input:focus { outline: 2px solid #6ea8ff; outline-offset: 1px; }

  .link { display: flex; gap: 8px; }
  .link input { min-width: 0; flex: 1; font-size: 14px; color: #3b3935; }
  button.copy, a.try {
    flex: none; font: inherit; font-weight: 600; border-radius: 10px; padding: 10px 16px;
    cursor: pointer; text-decoration: none; text-align: center;
  }
  button.copy { border: 0; background: #6ea8ff; color: #0e1a2b; }
  a.try { border: 1px solid #5a5650; color: #e9e6e1; }
</style>
</head>
<body>
  <main>
    <button class="note" id="note" type="button" aria-label="Preview of the note" aria-expanded="false"></button>

    <div class="field">
      <label for="text">Note</label>
      <textarea id="text" dir="auto" spellcheck="true" placeholder="Write the note here…" aria-describedby="text-hint"></textarea>
      <small id="text-hint">Markdown works: **bold**, *italic*, # Heading, - list, 1. list, --- line</small>
    </div>

    <div class="field">
      <label for="code">Answer</label>
      <input id="code" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" aria-describedby="code-hint">
      <small id="code-hint">Buttons 1–9, 0, X and Z, each once. Order doesn't matter.</small>
    </div>

    <div class="field">
      <label for="message">Message when it opens</label>
      <input id="message" maxlength="60" dir="auto" autocomplete="off" aria-describedby="message-hint">
      <small id="message-hint"></small>
    </div>

    <div class="field">
      <label for="link">Link</label>
      <div class="link">
        <input id="link" readonly>
        <button class="copy" id="copy" type="button">Copy</button>
      </div>
    </div>
    <a class="try" id="try" target="_blank" rel="noopener">Try it</a>
  </main>

  <script src="js/lockey-2930-rules.js"></script>
  <script src="js/note-link.js"></script>
  <script src="js/note-text.js"></script>
  <script src="js/make.js"></script>
</body>
</html>
