<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b1a19">
<title>Your Doors</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; min-height: 100dvh;
    background: radial-gradient(ellipse at 50% 30%, #2e2c2a, #161514 70%) fixed;
    color: #e9e6e1; font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  main {
    width: min(100%, 492px); margin: 0 auto;
    padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 16px;
  }
  h1 { font-size: 22px; }
  .status { font-size: 15px; color: #b9b5ae; }
  .status:empty { display: none; }

  /* One row a door: its words (open it) and an edit button. */
  .doors { list-style: none; display: flex; flex-direction: column; gap: 10px; }
  .door {
    display: flex; align-items: center; gap: 12px; padding: 12px 12px 12px 16px;
    border: 1px solid #3d3a36; border-radius: 12px; background: rgba(255, 255, 255, .04);
  }
  .door .open { flex: 1; min-width: 0; color: inherit; text-decoration: none; }
  .door .open:hover .words { text-decoration: underline; }
  .door .words {
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden;
    overflow-wrap: anywhere;
  }
  .door .answer { display: block; font-size: 13px; color: #8f8b85; letter-spacing: .08em; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }

  a.button {
    flex: none; font: inherit; font-weight: 600; border-radius: 10px; padding: 8px 14px;
    text-decoration: none; text-align: center; border: 1px solid #5a5650; color: #e9e6e1;
  }
  a.button.primary { border: 0; background: #6ea8ff; color: #0e1a2b; padding: 10px 16px; }
  nav { display: flex; gap: 8px; }
</style>
</head>
<body>
  <main>
    <h1>Your doors</h1>
    <p class="status" id="status" role="status">Loading…</p>
    <ol class="doors" id="doors"></ol>
    <nav>
      <a class="button primary" href="make.html">Make a door</a>
      <a class="button" href="./">The Door</a>
    </nav>
  </main>

  <script src="js/note-link.js"></script>
  <script src="js/note-text.js"></script>
  <script type="module" src="js/doors.js"></script>
</body>
</html>
